# ---------------------------------------------------------------------------
# 09-geometries.yaml — area geometries (reconstructed extents)
#
# WHY A SEPARATE FILE
#   Every polygon here is a *reconstruction*, not a surveyed boundary. Keeping them in one file
#   means a reviewer can audit the whole "where did we draw a shape and on what authority"
#   question without hunting through entity records (ADR-0013, AGENTS.md #7 / #9).
#
# HONESTY RULES APPLIED TO EVERY ENTRY
#   kind: extent_reconstructed   -> the shape is an interpretation, never a footprint
#   certainty: reconstructed     -> the UI renders it hatched/dashed and shows the note
#   year_from / year_to          -> an extent is only valid for its own years (ADR-0004)
#   source                       -> a citable work that describes the extent in words
#   note                         -> what the shape is NOT, and what must replace it
#
# These polygons are schematic: they encode the *scale and orientation* of a polity as described
# by the cited sources, so the map can show change over time. They must be replaced by
# digitized, per-source boundary research before any publication claims precision. The
# `needs_digitisation: true` marker keeps that obligation machine-readable.
# ---------------------------------------------------------------------------

geometries:

  # ============================================================ historical region
  - entity: plc_azerbaijan_historical
    kind: extent_reconstructed
    certainty: reconstructed
    type: Polygon
    year_from: -300
    year_to: 1925
    source: src_eir_azerbaijan_history
    needs_digitisation: true
    note_fa: >-
      محدودهٔ «آذربایجان تاریخی» در دوره‌ها متفاوت است؛ این شکل یک بازسازی طرح‌واره‌ای از
      هستهٔ پایدار منطقه (میان آرس در شمال، دریاچهٔ ارومیه، زنجان و کرانهٔ شرقی تا اردبیل) است
      و با تقسیمات استانی امروزی یکی نیست.
    note_en: >-
      The extent of historical Azerbaijan varied by period. This is a schematic reconstruction of
      the region's stable core (between the Aras, Lake Urmia, Zanjan and Ardabil) and is not
      identical with today's provinces.
    coordinates: [[[44.05, 39.75], [45.6, 39.75], [47.0, 39.6], [48.5, 39.35], [49.3, 38.6],
                   [49.0, 37.6], [48.2, 36.95], [47.0, 36.6], [45.8, 36.45], [44.95, 37.05],
                   [44.35, 38.0], [44.05, 39.0], [44.05, 39.75]]]

