# Alembic configuration for the AZ-IR atlas database.
#
# The URL is *not* stored here: `migrations/env.py` reads AZIR_DB_URL (see .env.example) so that
# credentials never enter version control. `sqlalchemy.url` below is only a last-resort default for
# local development.

[alembic]
script_location = migrations
prepend_sys_path = src
version_path_separator = os
sqlalchemy.url = postgresql+psycopg2://azir:azir@localhost:5432/azir

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
