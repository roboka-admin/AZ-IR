    summary_fa: "دولتی که از ۱۵۰۱ میلادی با تاج‌گذاری شاه اسماعیل در تبریز آغاز شد و مذهب شیعهٔ دوازده‌امامی را مذهب رسمی اعلام کرد."
    summary_en: "A state begun in 1501 with Shah Ismail's coronation in Tabriz, which declared Twelver Shi'ism the official faith."
