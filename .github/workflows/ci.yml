name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (lint, types, tests, PostGIS parity)
    runs-on: ubuntu-latest

    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: azir
          POSTGRES_PASSWORD: azir
          POSTGRES_DB: azir_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U azir -d azir_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      AZIR_DB_URL: postgresql+psycopg2://azir:azir@localhost:5432/azir_test
      AZIR_TEST_DB_URL: postgresql+psycopg2://azir:azir@localhost:5432/azir_test
      AZIR_FIXTURES_DIR: backend/seeds/fixtures

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: python -m ruff check src tests

      - name: Types (mypy --strict)
        run: python -m mypy src

      - name: Migrate
        run: python -m alembic upgrade head

      - name: Seed
        run: python -m azir.cli seed

      - name: Data health
        run: AZIR_DB_DRIVER=postgis python -m azir.cli --human-logs doctor

      # With AZIR_TEST_DB_URL set, the repository contract suite runs against *both* drivers, so a
      # behavioural difference between fixtures and PostGIS fails the build (ADR-0014).
      - name: Tests
        run: python -m pytest tests

  frontend:
    name: frontend (types, lint, production build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install the API (the build renders pages from it)
        run: pip install ./backend

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund
        working-directory: frontend

      - name: Types (tsc)
        run: npm run typecheck
        working-directory: frontend

      - name: Lint (eslint)
        run: npm run lint
        working-directory: frontend

      - name: Start the API on the fixtures driver
        run: |
          cd backend
          AZIR_FIXTURES_DIR=seeds/fixtures nohup python -m uvicorn azir.main:app \
            --app-dir src --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:8000/healthz > /dev/null && exit 0
            sleep 1
          done
          echo "API did not become healthy:"; cat /tmp/api.log; exit 1

      - name: Production build
        run: npm run build
        working-directory: frontend
        env:
          AZIR_BACKEND_URL: http://127.0.0.1:8000
