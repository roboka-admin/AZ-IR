      - {lang: en, form: "Ilkhanate", kind: preferred}
    summary_fa: "حکومت مغول بر ایران که آذربایجان را به مرکز سیاسی و علمی خود بدل کرد و پایتختش در این دوره جابه‌جا شد."
    summary_en: "Mongol rule over Iran, which turned Azerbaijan into its political and scholarly centre and moved its capital several times."
