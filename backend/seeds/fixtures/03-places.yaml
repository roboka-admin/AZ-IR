    summary_fa: "کوه آتشفشانی خاموش غرب اردبیل که در روایات محلی و متون کهن با جایگاه‌های زیارتی و افسانه‌ای پیوند دارد."
    summary_en: "A dormant stratovolcano west of Ardabil, linked in local tradition and older texts to pilgrimage and legendary associations."
