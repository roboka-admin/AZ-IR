    summary_en: "A plain north of Ardabil on both sides of the Aras, known as winter quarters (qishlāq) of tribal confederations and as the setting of several historical events."
    sources: [src_mustawfi_nuzha, src_minorsky_caucasian]
    coverage_note_fa: "محدودهٔ تاریخی مغان در منابع گوناگون متفاوت است و باید به‌صورت چند هندسهٔ زمان‌دار مدل شود."

