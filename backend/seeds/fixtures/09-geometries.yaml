    year_to: 2010
    source: src_osm_modern_admin
    needs_digitisation: true
    note_fa: >-
      پهنهٔ دریاچه در این بازه (پیش از خشک‌سازی گسترده). این شکل تقریبی است و باید با دادهٔ
      هیدرولوژیک معتبر (سنجش از دور) جایگزین شود.
    note_en: Approximate lake extent before the major shrinkage; to be replaced by remote-sensing data.
    coordinates: [[[44.95, 38.3], [45.6, 38.5], [46.15, 38.25], [46.4, 37.85], [46.2, 37.4],
                   [45.7, 37.0], [45.2, 37.1], [44.9, 37.6], [44.85, 38.0], [44.95, 38.3]]]

  - entity: plc_lake_urmia
    kind: footprint
    certainty: approximate
    type: Polygon
    year_from: 2011
    year_to: 2026
    source: src_osm_modern_admin
    needs_digitisation: true
    note_fa: >-
      پهنهٔ کوچک‌شدهٔ دریاچه پس از ۱۳۹۰ ش؛ مقایسهٔ دو هندسهٔ زمان‌دار، تغییر محیطی را روی نقشه
      نشان می‌دهد.
    note_en: The shrunken lake after 2011; comparing the two dated geometries shows environmental change on the map.
    coordinates: [[[45.45, 38.2], [45.95, 38.05], [46.0, 37.6], [45.6, 37.3], [45.25, 37.6],
                   [45.25, 38.0], [45.45, 38.2]]]

