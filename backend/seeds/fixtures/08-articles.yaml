  - id: art_chaldiran_1514
    slug: chaldiran-1514
    lang: fa
    status: published
    importance: 0.9
    revision: 4
    published_at: "2026-08-20"
    author: "AZ-IR editorial"
    reading_time_min: 8
    temporal: {from: 1514, to: 1555, precision: range, confidence: high, display_fa: "۱۵۱۴–۱۵۵۵ م"}
    names:
      - {lang: fa, form: "چالدران ۱۵۱۴: نبرد، روایت‌ها و محل میدان", kind: preferred}
      - {lang: en, form: "Chaldiran 1514: The Battle, Its Accounts and Its Location", kind: preferred}
    summary_fa: "نمونهٔ کارکرد «عدم‌قطعیت» در اطلس: نبردی که تاریخش روشن و محل دقیق میدان آن نامطمئن است."
    summary_en: "A working example of uncertainty in the atlas: a battle whose date is clear but whose exact field is not."
    body_fa_md: |
      ## دو چیز را از هم جدا کنیم

      در اطلس، «چه وقتی» و «دقیقاً کجا» دو پرسش جدا هستند. برای نبرد چالدران:

      - **زمان:** ۲۳ اوت ۱۵۱۴ میلادی (۲ رجب ۹۲۰ ق). دقت `exact_day`، اطمینان بالا.
      - **مکان:** ناحیهٔ چالدان در شمال غرب آذربایجان غربی. نقطهٔ دقیق میدان نبرد با
        `certainty=uncertain` ثبت شده است.

      این تفکیک عمدی است. اگر یک نقطهٔ ساختگی روی نقشه بگذاریم، کاربر آن را فکت می‌گیرد. به همین
      دلیل نقطهٔ میدان نبرد با زبان بصری «نامطمئن» (هاشور/نقطه‌چین) رندر می‌شود و در کارت موجودیت
      به‌عنوان **مورد اختلاف** با دو منبع نشان داده می‌شود.

      ## نبرد در گراف

      چالدران یک `battle` است که با `part_of` به رویداد والد «جنگ‌های عثمانی و صفوی» متصل می‌شود.
      این پاسخ پرسش طراحی اولیه است: **War یک موجودیت جدا نیست**؛ یک Event با فرزندانش است.

      شرکت‌کنندگان با نقش و سمت ثبت شده‌اند: شاه اسماعیل (فرمانده، سمت صفوی) و سلیم یکم
      (فرمانده، سمت عثمانی). نتیجهٔ نبرد به تغییر توازن نظامی و در درازمدت به جابه‌جایی پایتخت
      صفوی به قزوین در ۱۵۴۸ انجامید — رابطه‌ای که به‌صورت `led_to` ثبت شده است.
    body_en_md: |
      The atlas separates two questions. **When**: 23 August 1514 (2 Rajab 920 AH), `exact_day`,
      high confidence. **Where exactly**: the Chaldoran area, recorded with `certainty=uncertain`.

      That separation is deliberate. A fabricated point would be read as fact, so the battlefield is
      rendered with the "uncertain" visual language and surfaced as a disagreement with two sources.

      Chaldiran is a `battle` linked by `part_of` to a parent `war` event — which is why a War needs
      no separate entity type. Participants carry role and side; the outcome links forward via
      `led_to` to the 1548 move of the capital to Qazvin.
