         note: "Latin/European exonym used in early modern travel accounts."}
      - {lang: azb-Latn, form: "Təbriz", kind: endonym}
    summary_fa: "شهری در شمال غرب ایران که در دورهٔ ایلخانی به مرکز سیاسی و علمی بدل شد، نخستین پایتخت صفویان بود و در مشروطه نقش تعیین‌کننده داشت."
    summary_en: "A city in north-western Iran that became a political and scholarly centre under the Ilkhanids, served as the first Safavid capital, and played a decisive role in the Constitutional Revolution."
    sources: [src_eir_tabriz, src_rashid_al_din_jami, src_mustawfi_nuzha, src_unesco_tabriz_bazaar]

