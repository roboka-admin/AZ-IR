  - id: art_sheikh_safi_architecture
    slug: sheikh-safi-architecture
    lang: fa
    status: published
    importance: 0.85
    revision: 2
    published_at: "2026-08-12"
    author: "AZ-IR editorial"
    reading_time_min: 6
    temporal: {from: 1334, to: 1736, precision: range, confidence: medium, display_fa: "۱۳۳۴–۱۷۳۶ م"}
    names:
      - {lang: fa, form: "مجموعهٔ شیخ صفی: معماری و الحاقات", kind: preferred}
      - {lang: en, form: "The Sheikh Safi Ensemble: Architecture and Additions", kind: preferred}
    summary_fa: "مجموعه‌ای که یک‌جا ساخته نشد؛ خوانش الحاقات به‌عنوان لایه‌های زمانی روی نقشه."
    summary_en: "An ensemble that was not built at once: reading its additions as temporal layers on the map."
    body_fa_md: |
      ## مجموعه‌ای که یک‌جا ساخته نشد

      اشتباه رایج دربارهٔ بناهای تاریخی، تصور یک «تاریخ ساخت» واحد است. مجموعهٔ شیخ صفی از
      هستهٔ آرامگاه شیخ صفی‌الدین (درگذشتهٔ ۷۳۵ ق) آغاز شد و طی سده‌ها با الحاقات صفوی گسترش یافت.
      به همین دلیل در پایگاه داده، بازهٔ زمانی آن یک نقطه نیست: یک **range** با confidence متوسط است.

      این همان جایی است که **semantic zoom** معنا پیدا می‌کند. در zoom پایین مجموعه یک نقطهٔ مهم روی
      نقشهٔ اردبیل است؛ در zoom بالا باید بتوان اجزای آن را دید و در هر جزء، زمان الحاق را.

      ## آنچه ثبت شده و آنچه نشده

      موقعیت مجموعه از پروندهٔ یونسکو گرفته شده و certainty=exact دارد. اما هندسهٔ دقیق footprint
      و تفکیک اجزا هنوز رقومی‌سازی نشده است؛ در اطلس این به‌صورت خلأ پوشش ثبت شده تا کسی مرز
      ساختگی نبیند.

      > **قاعدهٔ پروژه:** هیچ هندسه‌ای بدون منبع و certainty ثبت نمی‌شود. نبودن داده بهتر از
      > دادهٔ ساختگی است.
    body_en_md: |
      A common mistake about historic buildings is to assume a single construction date. The Sheikh
      Safi ensemble began with the tomb of Sheikh Safi al-Din (d. 735 AH) and grew through Safavid
      additions; in the database its temporal extent is therefore a *range* with medium confidence.

      The site location comes from the UNESCO dossier with `certainty=exact`, but the precise
      footprint and the breakdown into components have not been digitized yet — recorded as a
      coverage gap rather than invented geometry.
