# Political entities. Extents are NOT digitized in the pilot on purpose: drawing a historical
# border requires a cited, certainty-tagged geometry (ADR-0013), which is a research task, not a
# coding task. The entities below are timeline/graph anchors until their extents are sourced.
political_entities:
  - id: pol_atropatene
    kind: kingdom
    slug: atropatene
    status: published
    importance: 0.7
    temporal: {from: -320, to: 226, precision: circa_year, confidence: low,
               display_fa: "حدود ۳۲۱ ق.م تا سدهٔ ۳ م"}
    names:
      - {lang: fa, form: "آتروپاتن", kind: preferred}
      - {lang: en, form: "Atropatene", kind: preferred}
      - {lang: fa, form: "آذرآبادگان", kind: historical}
    summary_fa: "پادشاهی‌ای که پس از اسکندر در شمال غرب ایران شکل گرفت و نام آن ریشهٔ نام آذربایجان دانسته می‌شود."
    summary_en: "A kingdom that emerged in north-western Iran after Alexander, whose name is held to be the root of 'Azerbaijan'."
    sources: [src_strabo_geographica, src_eir_azerbaijan_history]

  - id: pol_eldiguzids
