    names:
      - {lang: fa, form: "آذربایجان (منطقهٔ تاریخی)", kind: preferred}
      - {lang: en, form: "Azerbaijan (historical region)", kind: preferred}
      - {lang: fa, form: "آذربایگان", kind: historical, note: "شکل میانه/کهن نام."}
      - {lang: grc, form: "Atropatene", kind: historical, script: Latn}
    summary_fa: "منطقه‌ای تاریخی که محدودهٔ آن در دوره‌های گوناگون تغییر کرده و با تقسیمات استانی امروزی یکسان نیست."
    summary_en: "A historical region whose extent changed across periods and does not coincide with today's provinces."
    sources: [src_strabo_geographica, src_mustawfi_nuzha, src_eir_azerbaijan_history]
    coverage_note_fa: >-
      عمداً بدون هندسه: ترسیم محدودهٔ تاریخی یک تصمیم پژوهشی است که نیاز به منبع و certainty دارد
      (ADR-0013). این رکورد نمونهٔ تفاوت «منطقهٔ تاریخی» و «استان امروزی» است.

