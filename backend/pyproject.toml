[project]
name = "azir-backend"
version = "0.1.0"
description = "Interactive Historical Atlas of Iranian Azerbaijan - backend (FastAPI + PostGIS)"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg2-binary>=2.9.9",
    "shapely>=2.0",
    "pyyaml>=6.0",
    # Password hashing for the editorial panel (ADR-0017). The one dependency the write layer adds,
    # and a deliberate one: argon2id is the OWASP-recommended hash and this is its reference
    # implementation. Rolling our own on hashlib.scrypt would save a wheel and cost an audit.
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10", "types-PyYAML", "types-shapely"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
# E501: line length is enforced by the formatter's own rules where it matters.
# RUF001/002/003: this codebase is full of Persian and Arabic script on purpose -- the
# "ambiguous unicode character" heuristic would flag every label in the product.
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["azir"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
explicit_package_bases = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["postgis: requires a real PostgreSQL+PostGIS database (AZIR_TEST_DB_URL)"]
