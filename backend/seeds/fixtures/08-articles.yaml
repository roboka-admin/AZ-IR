# Articles are PRESENTATIONS of data, never the source of truth (AGENTS.md #8).
# Every fact used here must also exist as an entity/assertion with evidence; the article only
# narrates it and points back to the map (`map_state`) -- the two-way Article <-> Map link.
articles:
  - id: art_rise_of_safavids
    slug: rise-of-the-safavids
    lang: fa
    status: published
    importance: 0.95
    revision: 3
    published_at: "2026-08-01"
    author: "AZ-IR editorial"
    reading_time_min: 7
    temporal: {from: 1301, to: 1524, precision: range, confidence: high, display_fa: "۱۳۰۱–۱۵۲۴ م"}
    names:
      - {lang: fa, form: "از طریقت تا دولت: ظهور صفویان در آذربایجان", kind: preferred}
      - {lang: en, form: "From Sufi Order to State: The Rise of the Safavids in Azerbaijan", kind: preferred}
    summary_fa: "چگونه یک خانقاه در اردبیل در دو سده به یک دولت بدل شد، و چرا این تحول را باید روی نقشه و در زمان دید."
    summary_en: "How a khānegāh in Ardabil became a state over two centuries, and why that transformation is best read on a map and along a timeline."
    body_fa_md: |
      ## یک خانقاه، یک دولت

      داستان صفویان در **اردبیل** آغاز می‌شود، نه در تبریز. شیخ صفی‌الدین اردبیلی (۶۵۰–۷۳۵ ق)
      محفل عرفانی خود را در شهری در دامنهٔ سبلان بنیان گذاشت و در همان‌جا به خاک سپرده شد.
      آرامگاه او هستهٔ مجموعه‌ای شد که امروز به‌نام «مجموعهٔ خاندان و بقعهٔ شیخ صفی» در فهرست
      میراث جهانی ثبت شده است.

      در سه نسل نخست، جانشینان شیخ صفی — صدرالدین موسی، خواجه علی صفوی و سپس شیخ جنید —
      شبکهٔ مریدان را گسترش دادند. نقطهٔ چرخش، دورهٔ **شیخ جنید** است: طریقت از یک محفل
      عرفانی به نیرویی نظامی-سیاسی بدل می‌شود. شیخ حیدر این سازمان‌دهی را ادامه داد و
      ساختار نظامی قزلباش در همین دوره شکل گرفت.

      اسماعیل، پسر شیخ حیدر، در ۹۰۷ ق / ۱۵۰۱ م پس از پیروزی در **نبرد شروور** وارد **تبریز** شد
      و تاج‌گذاری کرد. این رویداد، نه مرگ شیخ صفی، آغاز دولت صفوی به شمار می‌رود.

      ## چرا زمان‌بندی اهمیت دارد

      در اطلس، تایم‌لاین را میان ۱۳۰۰ تا ۱۵۱۰ حرکت دهید: چیزی که می‌بینید تغییر تدریجی یک
      «مکان زیارتی» به یک «مرکز سیاسی» است. طریقت صفویه و دولت صفوی دو موجودیت جدا در پایگاه
      داده‌اند، چون یکی مقدمهٔ دیگری است نه همان.

      ## جای احتیاط

      تاریخ‌های این زنجیره یکدست نیستند. سال بنیان‌گذاری طریقت به‌صورت تقریبی ثبت شده و
      سال درگذشت خواجه علی در منابع متفاوت است (۱۴۲۷ یا ۱۴۲۹ میلادی). این اختلاف در اطلس
      پنهان نشده، بلکه به‌صورت یک «مورد اختلاف» با منبع نشان داده می‌شود.
    body_en_md: |
      The Safavid story begins in **Ardabil**, not Tabriz. Sheikh Safi al-Din (650–735 AH) founded
      a Sufi circle at the foot of Mount Sabalan and was buried there; his tomb became the core of
      the ensemble now inscribed as World Heritage.

      Three generations of successors — Sadr al-Din Musa, Khwāja ʿAlī and then Shaykh Junayd —
      expanded the network of disciples. The turning point is **Shaykh Junayd**, when the order
      became a military-political force; Shaykh Haydar completed the Qizilbash organisation.

      Ismail, Haydar's son, entered **Tabriz** in 907 AH / 1501 CE after his victory at **Sharur**
      and was crowned. That coronation — not Sheikh Safi's death — marks the start of the Safavid state.

      Dates in this chain are not uniform: the order's foundation is approximate and Khwāja ʿAlī's
      death year differs between sources (1427 or 1429). The atlas shows that disagreement rather
      than hiding it.
