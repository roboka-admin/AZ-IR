# Pilot dataset: Ardabil + regional anchors (docs/07 §5, handoff §28).
# RULES: never fabricate (AGENTS.md #10). Coordinates that could not be verified against a cited
# source are marked `certainty: approximate` or `uncertain` and carry a `note`.
# `importance` is the only human ranking input (docs/04 §4); everything else is derived.
places:
  # ---------------------------------------------------------------- Ardabil
  - id: plc_ardabil
    kind: city
    slug: ardabil
    status: published
    importance: 0.95
    temporal: {from: 450, to: 2026, precision: range, confidence: low,
               display_fa: "دورهٔ ساسانی تا امروز (قدمت پیش از آن محل بحث)"}
    geometry: {kind: point, certainty: exact, type: Point, coordinates: [48.2934, 38.2464]}
    names:
      - {lang: fa, form: "اردبیل", kind: preferred}
      - {lang: fa, form: "اردبيل", kind: alternative}
      - {lang: en, form: "Ardabil", kind: preferred, transliteration: Common}
      - {lang: en, form: "Ardebil", kind: alternative, transliteration: Common}
      - {lang: azb-Latn, form: "Ərdəbil", kind: endonym}
    summary_fa: "شهری در دامنه‌های شرقی کوه سبلان و مرکز طریقت صفویه؛ از سدهٔ هشتم قمری/چهاردهم میلادی به‌عنوان کانون زیارتی و سپس خاستگاه دولت صفوی اهمیت یافت."
    summary_en: "A city on the eastern flanks of Mount Sabalan and the centre of the Safaviyya order; from the 14th century CE it became a pilgrimage centre and later the cradle of the Safavid state."
    sources: [src_eir_ardabil, src_mustawfi_nuzha, src_unesco_sheikh_safi]
    coverage_note_fa: "هندسهٔ محدودهٔ تاریخی شهر رقومی‌سازی نشده است؛ فعلاً فقط نقطهٔ مرکزی ثبت شده."

  - id: plc_sheikh_safi_complex
    kind: mausoleum
    slug: sheikh-safi-complex
    status: published
    importance: 1.0
    temporal: {calendar: islamic_lunar, from: 735, to: 1245, precision: range, confidence: medium,
               display_fa: "از ۷۳۵ ق تا سدهٔ ۱۳ ق (الحاقات پیوسته)"}
    geometry: {kind: footprint, certainty: exact, type: Point, coordinates: [48.2931, 38.2506],
               note: "Coordinates of the inscribed property (UNESCO WHC list No. 1345)."}
    names:
      - {lang: fa, form: "بقعهٔ شیخ صفی‌الدین اردبیلی", kind: preferred}
      - {lang: fa, form: "مجموعهٔ خاندان و بقعهٔ شیخ صفی", kind: alternative}
      - {lang: fa, form: "بقعه شیخ صفی الدین", kind: alternative}
      - {lang: en, form: "Sheikh Safi al-din Khānegāh and Shrine Ensemble", kind: preferred, transliteration: EI3}
    summary_fa: "مجموعهٔ خانقاه و آرامگاه شیخ صفی‌الدین اردبیلی که طی سده‌ها به‌ویژه در دورهٔ صفوی گسترش یافت و در ۲۰۱۰ در فهرست میراث جهانی یونسکو ثبت شد."
    summary_en: "The khānegāh and shrine ensemble of Sheikh Safi al-Din, expanded over centuries and especially under the Safavids; inscribed on the UNESCO World Heritage List in 2010."
    sources: [src_unesco_sheikh_safi, src_blair_bloom_islam, src_eir_ardabil]

