  - id: art_tabriz_constitutional
    slug: tabriz-constitutional-era
    lang: fa
    status: in_review
    importance: 0.8
    revision: 1
    author: "AZ-IR editorial"
    reading_time_min: 6
    temporal: {from: 1906, to: 1909, precision: range, confidence: high, display_fa: "۱۹۰۶–۱۹۰۹ م"}
    names:
      - {lang: fa, form: "تبریز در مشروطه (۱۹۰۶–۱۹۰۹)", kind: preferred}
      - {lang: en, form: "Tabriz in the Constitutional Revolution (1906–1909)", kind: preferred}
    summary_fa: "پیش‌نویس در حال بازبینی: نقش تبریز در مشروطه و محاصرهٔ شهر، با تکیه بر کسروی و منابع بعدی."
    summary_en: "Draft under review: Tabriz's role in the Constitutional Revolution and the siege of the city."
    body_fa_md: |
      > **وضعیت: در حال بازبینی.** این مقاله هنوز منتشر نشده است زیرا نیاز دارد روایت‌های رقیب
      > دربارهٔ نقش انجمن‌های ایالتی و نیروهای خارجی به‌صورت assertion جدا با منبع ثبت شود.

      تبریز در مشروطه تنها یک صحنهٔ رویداد نیست؛ یکی از دو کانون اصلی جنبش است. ستارخان (زادهٔ
      قره‌داغ/اهر) و باقرخان (زادهٔ تبریز) رهبری مقاومت شهری را بر عهده داشتند و محاصرهٔ تبریز
      در ۱۹۰۸–۱۹۰۹ به یکی از رویدادهای محوری این دوره تبدیل شد.

      در مدل داده، «جنبش مشروطه در تبریز» یک رویداد والد است و «محاصرهٔ تبریز» با `part_of` به آن
      متصل می‌شود — همان الگویی که برای جنگ/نبرد به کار رفت.

      **کار باقی‌ماندهٔ ویرایشی:** افزودن منابع دانشگاهی جدیدتر در کنار کسروی (که خود از نزدیکان
      وقایع بود و روایتش جانب‌دار است)، و ثبت اختلاف‌ها دربارهٔ نقش نیروهای روسیه و عثمانی.
    body_en_md: |
      *Status: in review.* Tabriz was one of the two main centres of the Constitutional movement.
      Sattar Khan (from the Qaradagh/Ahar region) and Baqer Khan (born in Tabriz) led the urban
      resistance, and the 1908–1909 siege became a defining episode.

      Remaining editorial work: add recent scholarship alongside Kasravi (a participant whose account
      is partisan), and record disagreements about the role of Russian and Ottoman forces as separate
      sourced assertions.
