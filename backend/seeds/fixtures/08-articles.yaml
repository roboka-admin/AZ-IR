  - id: art_ardabil_shrine_city
    slug: ardabil-shrine-city
    lang: fa
    status: published
    importance: 0.9
    revision: 2
    published_at: "2026-08-05"
    author: "AZ-IR editorial"
    reading_time_min: 5
    temporal: {from: 1252, to: 1736, precision: range, confidence: medium, display_fa: "۱۲۵۲–۱۷۳۶ م"}
    names:
      - {lang: fa, form: "اردبیل: شهرِ زیارتگاهِ یک طریقت", kind: preferred}
      - {lang: en, form: "Ardabil: The Shrine City of an Order", kind: preferred}
    summary_fa: "اردبیل چگونه از یک شهر منطقه‌ای به کانون زیارتی طریقت صفویه تبدیل شد و چه چیزی از آن دوره باقی مانده است."
    summary_en: "How Ardabil became the pilgrimage centre of the Safaviyya order, and what survives from that period."
    body_fa_md: |
      ## شهری که با یک آرامگاه تعریف می‌شود

      اهمیت تاریخی اردبیل در اطلس نه به‌سبب وسعت یا جمعیت آن، بلکه به‌سبب **مجموعهٔ شیخ صفی** است.
      وقتی تایم‌لاین را از ۱۳۰۰ به ۱۶۰۰ می‌برید، اردبیل از یک شهر منطقه‌ای به مقصدی زیارتی و
      سپس به نماد مشروعیت یک سلسله بدل می‌شود.

      شاه اسماعیل در همان‌جا زاده شد و در همان مجموعه به خاک سپرده شد؛ این پیوند، اردبیل را از
      یک «مکان زادگاه» به یک «مکان مشروعیت‌بخش» تبدیل می‌کند. در مدل داده، این دو رابطه دو
      assertion جدا با منبع و بازهٔ زمانی‌اند: `born_in` و `burial_place`.

      ## جغرافیا

      اردبیل در دامنهٔ شرقی **سبلان** و در مسیر تاریخی **تبریز–اردبیل** قرار دارد. این موقعیت،
      هم دسترسی زیارت‌کنندگان را ممکن می‌کرد و هم شهر را در مسیر جابه‌جایی نیروها قرار می‌داد.

      ## چه چیزی هنوز نامعلوم است

      محدودهٔ تاریخی شهر رقومی‌سازی نشده است؛ در اطلس این به‌صورت «خلأ پوشش» نشان داده می‌شود
      نه به‌صورت یک مرز ساختگی. همچنین قدمت پیش از اسلام اردبیل محل بحث است و با confidence پایین
      ثبت شده است.
    body_en_md: |
      Ardabil's historical weight in this atlas comes from the **Sheikh Safi ensemble** rather than
      from size or population. Move the timeline from 1300 to 1600 and the city changes from a
      regional town into a pilgrimage destination and then into the symbol of a dynasty's legitimacy.

      Shah Ismail was born there and buried in the same ensemble: in the data model these are two
      separate, sourced, time-bounded assertions (`born_in` and `burial_place`).

      The historic extent of the city has not been digitized yet; the atlas reports that as a
      coverage gap instead of drawing an invented boundary.
