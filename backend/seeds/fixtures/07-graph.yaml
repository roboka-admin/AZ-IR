# The graph: structural links (identity-level, undisputed) + assertions (interpretive, citable,
# temporal, confidence-bearing). ADR-0003: assertions are the source of truth for facts.
place_links:
  # --- containment (city -> building/site). Structural, undisputed.
  - {parent: plc_ardabil,  child: plc_sheikh_safi_complex, kind: contains}
  - {parent: plc_ardabil,  child: plc_ardabil_bazaar,      kind: contains}
  - {parent: plc_tabriz,   child: plc_blue_mosque_tabriz,  kind: contains}
  - {parent: plc_tabriz,   child: plc_arg_tabriz,          kind: contains}
  - {parent: plc_tabriz,   child: plc_tabriz_bazaar,       kind: contains}
  - {parent: plc_tabriz,   child: plc_rab_rashidi,         kind: contains,
     note: "در حومهٔ تاریخی تبریز؛ مکان دقیق محل بررسی است."}
  - {parent: plc_maragheh, child: plc_maragheh_observatory, kind: contains}
  - {parent: plc_maragheh, child: plc_gonbad_sorkh,         kind: contains}
  - {parent: plc_soltaniyeh, child: plc_dome_soltaniyeh,    kind: contains}
  - {parent: plc_urmia,    child: plc_urmia_jameh_mosque,   kind: contains}
  - {parent: plc_jolfa,    child: plc_st_stepanos,          kind: contains}
  - {parent: plc_chaldoran, child: plc_chaldoran_battlefield, kind: contains}
  - {parent: plc_chaldoran, child: plc_qara_kelisa,         kind: contains,
     note: "قره‌کلیسا در ناحیهٔ چالدران قرار دارد."}
  - {parent: plc_kalibar,  child: plc_babak_castle,         kind: contains}

  # --- historical vs modern: these MUST stay different kinds (AGENTS.md #9)
  - {parent: plc_azerbaijan_historical, child: plc_ardabil,  kind: historically_in,
     temporal: {from: 800, to: 1925, precision: range, confidence: medium},
     sources: [src_mustawfi_nuzha]}
  - {parent: plc_azerbaijan_historical, child: plc_tabriz,   kind: historically_in,
     temporal: {from: 800, to: 1925, precision: range, confidence: medium},
     sources: [src_mustawfi_nuzha]}
  - {parent: plc_azerbaijan_historical, child: plc_urmia,    kind: historically_in,
     temporal: {from: 800, to: 1925, precision: range, confidence: medium},
     sources: [src_mustawfi_nuzha]}
  - {parent: plc_ardabil_province,        child: plc_ardabil, kind: admin_in,
     sources: [src_osm_modern_admin], note: "لایهٔ اداری امروزی؛ هرگز به‌عنوان مرز تاریخی نمایش داده نمی‌شود."}
  - {parent: plc_east_azerbaijan_province, child: plc_tabriz, kind: admin_in,
     sources: [src_osm_modern_admin]}
  - {parent: plc_east_azerbaijan_province, child: plc_maragheh, kind: admin_in,
     sources: [src_osm_modern_admin]}
  - {parent: plc_west_azerbaijan_province, child: plc_urmia,  kind: admin_in,
     sources: [src_osm_modern_admin]}
  - {parent: plc_west_azerbaijan_province, child: plc_takht_soleyman, kind: admin_in,
     sources: [src_osm_modern_admin]}

