  - id: plc_mughan
    kind: historical_region
    slug: mughan-plain
    status: published
    importance: 0.7
    temporal: {calendar: islamic_lunar, from: 200, to: 1300, precision: range, confidence: medium,
               display_fa: "از سدهٔ ۳ ق تا دورهٔ معاصر"}
    geometry: {kind: point, certainty: approximate, type: Point, coordinates: [47.7000, 39.2000],
               note: "نقطهٔ معرف دشت مغان؛ محدودهٔ دقیق تاریخی آن در منابع متفاوت است."}
    names:
      - {lang: fa, form: "دشت مغان", kind: preferred}
      - {lang: en, form: "Mughan Plain", kind: preferred}
