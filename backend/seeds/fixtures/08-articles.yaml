  - id: art_ilkhanid_centres
    slug: ilkhanid-centres
    lang: fa
    status: published
    importance: 0.85
    revision: 2
    published_at: "2026-08-28"
    author: "AZ-IR editorial"
    reading_time_min: 7
    temporal: {from: 1256, to: 1335, precision: range, confidence: high, display_fa: "۱۲۵۶–۱۳۳۵ م"}
    names:
      - {lang: fa, form: "مراغه و سلطانیه: مراکز ایلخانی آذربایجان", kind: preferred}
      - {lang: en, form: "Maragheh and Soltaniyeh: Ilkhanid Centres of Azerbaijan", kind: preferred}
    summary_fa: "چگونه پایتخت ایلخانی جابه‌جا شد و چرا این جابه‌جایی یک رابطهٔ زمان‌دار است نه یک ویژگی ثابت."
    summary_en: "How the Ilkhanid capital moved, and why that is a time-bounded relation rather than a fixed attribute."
    body_fa_md: |
      ## پایتخت یک ویژگی ثابت نیست

      «پایتخت ایلخانان» یک شهر نیست؛ یک **رابطهٔ زمان‌دار** است. در مدل داده، هر جابه‌جایی یک
      assertion با بازهٔ زمانی خودش است:

      | بازه | مرکز | اطمینان |
      |------|------|---------|
      | حدود ۱۲۵۶–۱۲۶۵ | مراغه | پایین |
      | حدود ۱۲۶۵–۱۳۰۵ | تبریز | متوسط |
      | حدود ۱۳۰۵–۱۳۳۵ | سلطانیه | متوسط |

      به همین دلیل وقتی تایم‌لاین را از ۱۲۶۰ به ۱۳۱۰ می‌برید، نقطهٔ «مرکز» روی نقشه جابه‌جا می‌شود
      — و این جابه‌جایی داده است، نه انیمیشن تزئینی.

      ## رصدخانه و گنبد

      دو میراث شاخص این دوره در اطلس به هم مرتبط‌اند: **رصدخانهٔ مراغه** که در ۶۵۷ ق / ۱۲۵۹ م به
      حمایت هولاکو و به مدیریت خواجه نصیرالدین طوسی بنیان گذاشته شد، و **گنبد سلطانیه** که
      الجایتو میان ۷۰۳ و ۷۱۲ ق ساخت.

      ## احتیاط

      عنوان «پایتخت» برای دورهٔ مراغه در منابع یکدست نیست؛ آن assertion با `confidence=low` و
      stance=`qualifies` ثبت شده است. محل درگذشت هولاکو هم در منابع متفاوت آمده و به‌صورت
      **مورد اختلاف** نمایش داده می‌شود.
    body_en_md: |
      "Capital of the Ilkhanate" is not a city but a **time-bounded relation**: Maragheh
      (c. 1256–1265, low confidence), Tabriz (c. 1265–1305), Soltaniyeh (c. 1305–1335). Dragging the
      timeline moves the centre — and that movement is data, not decoration.

      Two landmarks are linked in the graph: the Maragheh observatory founded in 657 AH / 1259 CE
      under Hülegü's patronage and Nasir al-Din al-Tusi's direction, and the Dome of Soltaniyeh
      built by Öljaitü between 703 and 712 AH.

      The title "capital" for the Maragheh phase is not uniform across sources, so that assertion is
      stored with `confidence=low`; the place of Hülegü's death is stored as a disagreement.
