               display_fa: "گسترش عمده در دورهٔ صفوی؛ ساختار کنونی متأخرتر"}
    geometry: {kind: point, certainty: approximate, type: Point, coordinates: [48.2880, 38.2470],
               note: "مکان تقریبی؛ نیازمند تأیید میدانی/رقومی‌سازی دقیق."}
    names:
      - {lang: fa, form: "بازار تاریخی اردبیل", kind: preferred}
      - {lang: en, form: "Ardabil Historic Bazaar", kind: preferred}
    summary_fa: "بافت تجاری تاریخی اردبیل؛ بخش عمدهٔ ساختار کنونی به دوره‌های متأخرتر بازمی‌گردد."
    summary_en: "The historic commercial fabric of Ardabil; much of the surviving structure belongs to later periods."
    sources: [src_national_heritage_register]
    coverage_note_fa: "تاریخ‌گذاری دقیق بناها انجام نشده است."

  - id: plc_azerbaijan_historical
